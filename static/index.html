<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心语 · EchoOfMind</title>
<style>
  :root { --bg:#101418; --card:#1a2028; --accent:#7ab8a8; --text:#e8e6e3; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; justify-content:center; height:100vh; }
  .app { width:min(720px,100%); display:flex; flex-direction:column; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; }
  header h1 { font-size:18px; font-weight:600; }
  #unlockBtn { background:none; border:1px solid var(--accent); color:var(--accent);
               border-radius:8px; padding:4px 12px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:12px 0; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2a3540; }
  .bot  { align-self:flex-start; background:var(--card); }
  .card { align-self:flex-start; background:#3a2626; border:1px solid #a35; }
  form { display:flex; gap:8px; padding-top:8px; }
  input[type=text] { flex:1; background:var(--card); border:1px solid #333;
                     color:var(--text); border-radius:10px; padding:12px; font-size:15px; }
  button[type=submit] { background:var(--accent); color:#10201c; border:none;
                        border-radius:10px; padding:0 22px; font-size:15px; cursor:pointer; }
  dialog { background:var(--card); color:var(--text); border:none; border-radius:12px;
           padding:20px; width:min(420px,90vw); }
  dialog h3 { margin-bottom:12px; }
  dialog p { font-size:13px; color:#9ab; margin:8px 0; line-height:1.6; }
  #entries { margin-top:10px; max-height:40vh; overflow-y:auto; font-size:13px; }
  .entry { background:#141a20; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌙 心语</h1>
    <button id="unlockBtn">📖 日记</button>
  </header>
  <div id="chat"></div>
  <form id="f">
    <input type="text" id="box" placeholder="今晚想说点什么…" autocomplete="off">
    <button type="submit">发送</button>
  </form>
</div>

<dialog id="dlg">
  <h3>日记已加密</h3>
  <p>每一段对话都以密文保存，只有口令能打开。首次使用请先保存口令文件
     <code>backend/app/.diary_key</code> 中的字符串。</p>
  <input type="password" id="pass" placeholder="输入口令解锁" style="width:100%;padding:10px;">
  <p><button id="doUnlock" style="padding:8px 18px;">解锁</button>
     <button id="lockBtn" style="padding:8px 18px;display:none;">🔒 上锁</button></p>
  <div id="entries"></div>
</dialog>

<script>
/* ---------- 聊天区 ---------- */
const chat = document.getElementById("chat");
const history = [];

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const box = document.getElementById("box");
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  add("user", text);
  const thinking = add("bot", "…");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history})
    });
    const j = await r.json();
    thinking.textContent = j.reply;
    thinking.className = "msg bot" + (j.show_card ? " card" : "");
    history.push({role:"user", content:text}, {role:"assistant", content:j.reply});
    if (j.show_card) {
      add("bot", "☎ 可拨打：" + j.hotlines.map(h=>`${h.name} ${h.phone}`).join(" ｜ "));
    }
  } catch {
    thinking.textContent = "（连接中断了。确认 llama-server 和 uvicorn 都在运行。）";
  }
};

/* ---------- 日记面板（含锁状态管理） ---------- */
const dlg = document.getElementById("dlg");

function renderDiary(entries) {
  document.getElementById("entries").innerHTML = entries.map(e =>
    `<div class="entry"><b>${new Date(e.ts*1000).toLocaleString("zh-CN")}</b>
     ${e.risk>0 ? " · ⚠"+e.risk : ""}<br>${e.user.replace(/</g,"&lt;")}
     <br><span style="color:#7ab8a8">心语：${e.bot.replace(/</g,"&lt;")}</span></div>`
  ).join("");
}

async function refreshDiary() {
  const health = await (await fetch("/api/health")).json();
  const pass = document.getElementById("pass");
  const unlockBtn = document.getElementById("doUnlock");
  const lockBtn = document.getElementById("lockBtn");
  const entriesBox = document.getElementById("entries");
  if (health.unlocked) {
    pass.style.display = "none";
    unlockBtn.style.display = "none";
    lockBtn.style.display = "inline-block";
    const r = await fetch("/api/diary");
    if (r.ok) renderDiary((await r.json()).entries);
  } else {
    pass.style.display = "block";
    unlockBtn.style.display = "inline-block";
    lockBtn.style.display = "none";
    pass.value = "";
    entriesBox.innerHTML = "<p>🔒 已上锁。输入口令后可查看日记。</p>";
  }
}

document.getElementById("unlockBtn").onclick = () => {
  dlg.showModal();
  refreshDiary();
};

document.getElementById("doUnlock").onclick = async () => {
  const pass = document.getElementById("pass");
  const r = await fetch("/api/unlock", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({passphrase: pass.value})
  });
  if (!r.ok) { pass.value = ""; pass.placeholder = "口令不正确，再试一次"; return; }
  refreshDiary();
};

document.getElementById("lockBtn").onclick = async () => {
  await fetch("/api/lock", {method: "POST"});
  refreshDiary();
};
</script>
</body>
</html>
